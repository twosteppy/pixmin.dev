name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install ufbt
        run: pip install ufbt

      - name: build apps
        run: |
          mkdir -p dist/apps
          for app in firmware/applications/external/*/; do
            name=$(basename "$app")
            echo "building $name"
            ufbt --appdir="$app" || true
            find "$app" -name "*.fap" -exec cp {} dist/apps/ \;
          done

      - name: copy scripts into sd-card layout
        run: |
          mkdir -p dist/subghz/pixmin
          mkdir -p dist/infrared/pixmin
          mkdir -p dist/badusb/pixmin
          cp -r scripts/subghz/*   dist/subghz/pixmin/
          cp -r scripts/infrared/* dist/infrared/pixmin/
          cp -r scripts/badusb/*   dist/badusb/pixmin/

      - name: package release zip
        run: |
          cd dist
          zip -r ../pixmin-release.zip apps subghz infrared badusb
          cd ..
          echo "zip contents:"
          unzip -l pixmin-release.zip | head -40

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixmin-release
          path: pixmin-release.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pixmin-release

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: "pixmin ${{ github.ref_name }}"
          body: |
            ## Install — two ways

            **Auto (recommended):**
            ```
            python3 installer/install.py
            ```
            Plug your Flipper in, run the command, done.

            **Manual:**
            1. Download `pixmin-release.zip`
            2. Unzip it
            3. Plug Flipper in via USB, open **qFlipper → File Manager**
            4. Drag the contents into your SD card root — folders match exactly
            5. Done
          files: pixmin-release.zip
          draft: false
          prerelease: false
